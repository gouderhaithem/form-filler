<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Formly test form</title><style>body{font-family:system-ui,sans-serif;margin:0;padding:27px;color:#39433b;background:#fff}h1{font-size:21px;letter-spacing:-.5px;margin:0 0 6px}p{font-size:11px;color:#92998e;line-height:1.7;margin:0 0 23px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:17px 14px}label{display:block;font-size:10px;color:#737e72;margin-bottom:6px}input,select,textarea{box-sizing:border-box;width:100%;padding:10px;border:1px solid #e0e5dc;border-radius:4px;background:#fafbf9;font:12px system-ui;color:#3c4939}input:focus,select:focus,textarea:focus{outline:2px solid #a9bca0}input:valid:not(:placeholder-shown){background:#f7faf4}.wide{grid-column:1/-1}h2{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#99a090;margin:25px 0 15px;border-top:1px solid #edf0e9;padding-top:20px}fieldset{border:0;padding:0;margin:0}legend{font-size:10px;margin-bottom:8px}.choice{display:flex;gap:8px;align-items:center}.choice input{width:auto}.choice label{margin:0}.choices{display:flex;gap:15px;flex-wrap:wrap}textarea{resize:vertical;min-height:64px}.caption{margin:22px 0 0;font-size:10px}@media(max-width:380px){body{padding:18px}.grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><h1>A little bit of everything.</h1><p>A mixed-language form to put your test data to work.</p><form id="test-form"><div class="grid"><div><label for="first">Prénom</label><input id="first" name="firstName" autocomplete="given-name" placeholder="First name"></div><div><label for="last">اللقب</label><input id="last" name="lastName" placeholder="Last name"></div><div><label for="full">Full name</label><input id="full" autocomplete="name" placeholder="Your full name"></div><div><label for="username">اسم المستخدم</label><input id="username" placeholder="Username"></div><div class="wide"><label for="email">Adresse électronique</label><input id="email" type="email" placeholder="you@example.com"></div><div><label for="phone">رقم الهاتف</label><input id="phone" type="tel" placeholder="Phone number"></div><div><label for="birth">Date de naissance</label><input id="birth" type="date"></div></div><h2>Work & address</h2><div class="grid"><div><label for="company">Entreprise</label><input id="company" placeholder="Company"></div><div><label for="job">Job title</label><input id="job" placeholder="Job title"></div><div class="wide"><label for="address">العنوان</label><input id="address" autocomplete="street-address" placeholder="Street address"></div><div><label for="city">Ville</label><input id="city" placeholder="City"></div><div><label for="country">Country</label><select id="country" autocomplete="country"><option value="">Select country</option><option value="US">United States</option><option value="DZ">Algeria</option><option value="FR">France</option></select></div><div><label for="quantity">Quantité (1–10)</label><input id="quantity" type="number" min="1" max="10" placeholder="0"></div><div><label for="project-code">Project code</label><input id="project-code" placeholder="Try a custom field"></div><div class="wide"><label for="message">Message</label><textarea id="message" placeholder="Your test message"></textarea></div></div><h2>Optional controls</h2><div class="grid"><div><label for="appointment">Appointment</label><input id="appointment" type="datetime-local"></div><div><label for="pwd">Password</label><input id="pwd" type="password" autocomplete="new-password"></div><fieldset class="wide"><legend>Preferred contact method</legend><div class="choices"><div class="choice"><input id="contact-email" type="radio" name="contact" value="email"><label for="contact-email">Email</label></div><div class="choice"><input id="contact-phone" type="radio" name="contact" value="phone"><label for="contact-phone">Phone</label></div></div></fieldset><div class="choice wide"><input type="checkbox" id="terms"><label for="terms">I agree to the terms and conditions</label></div></div></form><p class="caption">Demo only. Nothing is submitted or sent to a server.</p><script type="module" src="/src/demo.ts"></script></body></html>
